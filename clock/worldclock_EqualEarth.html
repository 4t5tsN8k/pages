<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界時計 - イコールアース図法</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
        }
        #map-container {
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            max-width: 1000px;
        }
        svg {
            width: 100%;
            height: auto;
        }
        .country {
            fill: #cce0db;
            stroke: #ffffff;
            stroke-width: 0.5px;
        }
        .city-marker {
            fill: #ff4757;
            stroke: #fff;
            stroke-width: 1.5px;
        }
        .city-label {
            font-size: 12px;
            font-weight: bold;
            fill: #2f3542;
            pointer-events: none;
            /* 文字が見やすいように白フチをつける */
            paint-order: stroke;
            stroke: #ffffff;
            stroke-width: 3px;
            stroke-linecap: butt;
            stroke-linejoin: miter;
        }
        .time-label {
            font-size: 13px;
            font-weight: bold;
            fill: #1e90ff;
            pointer-events: none;
            paint-order: stroke;
            stroke: #ffffff;
            stroke-width: 3px;
        }
    </style>
</head>
<body>

    <h1>世界時計 (イコールアース図法)</h1>
    <div id="map-container"></div>
    <div style="margin-top:20px; text-align:center;">
        <a href="../" style="color:#00ff41; text-decoration:none; font-size:0.8rem;">
            <- return
        </a>
    </div>
    <script>
        // 主要都市のデータ (緯度, 経度, タイムゾーン)
        const cities = [
            { name: "東京", lon: 139.6917, lat: 35.6895, tz: "Asia/Tokyo" },
            { name: "ロンドン", lon: -0.1278, lat: 51.5074, tz: "Europe/London" },
            { name: "ニューヨーク", lon: -74.0060, lat: 40.7128, tz: "America/New_York" },
            { name: "シドニー", lon: 151.2093, lat: -33.8688, tz: "Australia/Sydney" },
            { name: "ドバイ", lon: 55.2708, lat: 25.2048, tz: "Asia/Dubai" },
            { name: "リオデジャネイロ", lon: -43.1729, lat: -22.9068, tz: "America/Sao_Paulo" },
            { name: "ヨハネスブルグ", lon: 28.0473, lat: -26.2041, tz: "Africa/Johannesburg" },
            { name: "ロサンゼルス", lon: -118.2437, lat: 34.0522, tz: "America/Los_Angeles" },
            { name: "デリー", lon: 77.2090, lat: 28.6139, tz: "Asia/Kolkata" }
        ];

        // SVGの設定
        const width = 1000;
        const height = 600;
        
        const svg = d3.select("#map-container")
            .append("svg")
            .attr("viewBox", `0 0 ${width} ${height}`);

        // イコールアース図法の投影設定
        const projection = d3.geoEqualEarth()
            .scale(180)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath().projection(projection);

        // 世界地図のGeoJSONデータを取得して描画
        const geojsonUrl = "https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson";

        d3.json(geojsonUrl).then(function(data) {
            // 地図の描画
            svg.append("g")
                .selectAll("path")
                .data(data.features)
                .enter()
                .append("path")
                .attr("class", "country")
                .attr("d", path);

            // 都市のグループを作成
            const cityGroups = svg.selectAll(".city")
                .data(cities)
                .enter()
                .append("g")
                .attr("class", "city")
                .attr("transform", d => {
                    const coords = projection([d.lon, d.lat]);
                    return `translate(${coords[0]}, ${coords[1]})`;
                });

            // 都市のマーカー（赤い点）
            cityGroups.append("circle")
                .attr("class", "city-marker")
                .attr("r", 5);

            // 都市名ラベル
            cityGroups.append("text")
                .attr("class", "city-label")
                .attr("x", 8)
                .attr("y", -5)
                .text(d => d.name);

            // 時刻ラベル
            const timeLabels = cityGroups.append("text")
                .attr("class", "time-label")
                .attr("x", 8)
                .attr("y", 12);

            // 時刻を更新する関数
            function updateTimes() {
                const now = new Date();
                timeLabels.text(d => {
                    // 各都市のタイムゾーンに合わせて時刻をフォーマット
                    const options = { 
                        timeZone: d.tz, 
                        hour: '2-digit', 
                        minute: '2-digit', 
                        second: '2-digit',
                        hour12: false 
                    };
                    return new Intl.DateTimeFormat('ja-JP', options).format(now);
                });
            }

            // 初回実行と1秒ごとの更新
            updateTimes();
            setInterval(updateTimes, 1000);
        });
    </script>
    
</body>
</html>
