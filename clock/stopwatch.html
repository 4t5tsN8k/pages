<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ストップウォッチ</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #111;
    color: #00ff88;
    font-family: monospace;
}

#display {
    font-size: 18vmin;
    margin-bottom: 3vmin;
    text-shadow: 0 0 2vmin rgba(0,255,136,0.7);
}

.buttons {
    display: flex;
    gap: 2vmin;
}

button {
    font-size: 4vmin;
    padding: 1vmin 3vmin;
    border: none;
    border-radius: 1vmin;
    background: #222;
    color: #00ff88;
    cursor: pointer;
    box-shadow: 0 0.5vmin 1vmin rgba(0,0,0,0.5);
}

button:active {
    transform: translateY(0.3vmin);
}
</style>
</head>

<body>

<div id="display">00:00:00</div>

<div class="buttons">
    <button onclick="toggle()">開始/停止</button>
    <button onclick="resetWatch()">リセット</button>
</div>
<div style="margin-top:30px; text-align:center;">
    <a href="../" style="color:#00ff41; text-decoration:none; font-size:0.5rem;">
        <- return
    </a>
</div>
<script>
let startTime = 0;
let elapsed = 0;
let timer = null;
let running = false;

function toggle() {
    if (!running) {
        running = true;
        startTime = Date.now() - elapsed;
        timer = setInterval(update, 10);
    } else {
        running = false;
        clearInterval(timer);
    }
}

function resetWatch() {
    running = false;
    clearInterval(timer);
    elapsed = 0;
    startTime = Date.now();
    document.getElementById("display").textContent = "00:00:00";
}

function update() {
    elapsed = Date.now() - startTime;

    const ms = Math.floor((elapsed % 1000) / 10);
    const sec = Math.floor(elapsed / 1000) % 60;
    const min = Math.floor(elapsed / 60000) % 60;

    document.getElementById("display").textContent =
        `${String(min).padStart(2,'0')}:` +
        `${String(sec).padStart(2,'0')}:` +
        `${String(ms).padStart(2,'0')}`;
}
</script>

</body>
</html>
