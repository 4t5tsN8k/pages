<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Pomodoro</title>

<style>
:root{
    --work:#00ff41;
    --break:#3ba4ff;
}

body{
    margin:0;
    background:#0d0d0d;
    color:#00ff41;
    font-family:'Courier New', monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:10px;
    box-sizing:border-box;
}

.container{
    width:100%;
    max-width:420px;
    text-align:center;
}

/* ===== Binary ===== */

.binary{
    margin-bottom:15px;
}

.row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:4px 0;
}

.label{
    width:45px;
    font-size:.75rem;
}

.dots{
    display:flex;
    flex-direction:row-reverse;
    gap:clamp(4px,1.5vw,8px);
}

.dot{
    width:clamp(12px,3.5vw,18px);
    height:clamp(12px,3.5vw,18px);
    background:#222;
    border-radius:2px;
}

.dot.on{
    background:var(--work);
    box-shadow:0 0 6px var(--work);
}

/* ===== circle ===== */

.timer{
    width:min(65vw,240px);
    height:min(65vw,240px);
    margin:15px auto;
}

.progress{
    width:100%;
    height:100%;
    border-radius:50%;
    background:conic-gradient(var(--work) 360deg,#222 0);
    display:flex;
    align-items:center;
    justify-content:center;
}

.inner{
    width:80%;
    height:80%;
    background:#0d0d0d;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(1.6rem,5vw,2rem);
}

/* ===== buttons ===== */

.controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:10px;
}

button{
    background:#111;
    border:1px solid #00ff41;
    color:#00ff41;
    padding:12px 16px;
    cursor:pointer;
    border-radius:8px;
    flex:1;
}

button:active{
    transform:scale(.96);
}

/* ===== settings ===== */

.settings{
    margin-top:15px;
    display:flex;
    gap:10px;
}

.settings div{
    flex:1;
}

input{
    width:100%;
    text-align:center;
    background:#111;
    color:#00ff41;
    border:1px solid #00ff41;
    padding:8px;
    border-radius:6px;
    box-sizing:border-box;
}

</style>
</head>

<body>

<div class="container">

<div class="binary">
    <div class="row">
        <div class="label">MIN</div>
        <div class="dots" id="minDots"></div>
    </div>
    <div class="row">
        <div class="label">SEC</div>
        <div class="dots" id="secDots"></div>
    </div>
</div>

<div class="timer">
    <div class="progress" id="progress">
        <div class="inner" id="time">25:00</div>
    </div>
</div>

<div class="controls">
<button id="start">START</button>
<button id="reset">RESET</button>
</div>

<div class="settings">
<div>
作業<br>
<input type="number" id="work" value="25">
</div>
<div>
休憩<br>
<input type="number" id="break" value="5">
</div>
</div>

<div style="margin-top:15px;">
<a href="../" style="color:#00ff41; text-decoration:none; font-size:0.6rem;">
← return
</a>
</div>

</div>

<script>

let isRunning=false;
let isWork=true;
let timer;

let total=25*60;
let remain=total;

let audioCtx=null;

/* ドット生成 */
function setup(id,count){
    const el=document.getElementById(id);
    for(let i=0;i<count;i++){
        const d=document.createElement("div");
        d.className="dot";
        el.appendChild(d);
    }
}
setup("minDots",6);
setup("secDots",6);

/* binary描画 */
function render(id,val){
    const dots=document.getElementById(id).children;
    const bin=val.toString(2).split("").reverse();
    for(let i=0;i<dots.length;i++){
        dots[i].classList.toggle("on",bin[i]==="1");
    }
}

/* 表示更新 */
function update(){

    const m=Math.floor(remain/60);
    const s=remain%60;

    document.getElementById("time").textContent=
    `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

    document.title=`🍅 ${m}:${String(s).padStart(2,"0")}`;

    render("minDots",m);
    render("secDots",s);

    const percent=remain/total;
    const deg=percent*360;

    const color=isWork?"var(--work)":"var(--break)";

    document.getElementById("progress").style.background=
    `conic-gradient(${color} ${deg}deg,#222 ${deg}deg)`;
}

/* 音 (iPhone対応) */
function beep(){
    if(!audioCtx) return;

    for(let i=0;i<3;i++){
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.connect(g); 
        g.connect(audioCtx.destination);
        o.frequency.value=880;
        g.gain.setValueAtTime(0.2,audioCtx.currentTime);
        o.start(audioCtx.currentTime+i*0.4);
        o.stop(audioCtx.currentTime+i*0.4+0.3);
    }

    if(navigator.vibrate){
        navigator.vibrate([200,100,200]);
    }
}

/* 切替 */
function switchMode(){

    isWork=!isWork;

    const w=document.getElementById("work").value;
    const b=document.getElementById("break").value;

    total=(isWork?w:b)*60;
    remain=total;

    document.body.style.color=isWork?"#00ff41":"#3ba4ff";
}

/* tick */
function tick(){
    remain--;
    if(remain<=0){
        beep();
        switchMode();
    }
    update();
}

/* start */
document.getElementById("start").onclick=()=>{

    // iPhone音許可
    if(!audioCtx){
        audioCtx=new (window.AudioContext||window.webkitAudioContext)();
        audioCtx.resume();
    }

    if(!isRunning){
        timer=setInterval(tick,1000);
        isRunning=true;
    }else{
        clearInterval(timer);
        isRunning=false;
    }
};

/* reset */
document.getElementById("reset").onclick=()=>{
    clearInterval(timer);
    isRunning=false;
    total=document.getElementById("work").value*60;
    remain=total;
    isWork=true;
    update();
};

update();

</script>

</body>
</html>
