<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Pomodoro Timer</title>

<style>
body {
    background-color: #0d0d0d;
    color: #00ff41;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: 'Courier New', Courier, monospace;
    padding: 15px;
    box-sizing:border-box;
}

.clock-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: #1a1a1a;
    padding: clamp(20px,5vw,40px);
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0,255,65,0.2);
    width:100%;
    max-width:420px;
}

.unit-row {
    display: flex;
    align-items: center;
    justify-content:space-between;
}

.label {
    width: 60px;
    font-size: clamp(0.9rem,3vw,1.2rem);
    font-weight: bold;
}

.dots-container {
    display: flex;
    flex-direction: row-reverse;
    gap: clamp(6px,2vw,15px);
}

.dot {
    width: clamp(14px,4vw,25px);
    height: clamp(14px,4vw,25px);
    border-radius: 4px;
    background-color: #333;
    border: 1px solid #444;
    transition: all 0.2s;
}

.dot.on {
    background-color: #00ff41;
    box-shadow: 0 0 12px #00ff41;
    border: 1px solid #fff;
}

#digital-display {
    margin-top: 20px;
    font-size: clamp(1.4rem,5vw,1.8rem);
    letter-spacing: 4px;
}

.controls {
    margin-top: 20px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

button {
    background: #111;
    border: 1px solid #00ff41;
    color: #00ff41;
    padding: 14px 18px;
    cursor: pointer;
    font-family: inherit;
    border-radius:8px;
    min-width:100px;
    font-size:0.9rem;
}

button:active {
    transform:scale(.96);
}

button:hover {
    background: #00ff41;
    color: #000;
}

@media(max-width:480px){
button{
    flex:1;
}
}
</style>
</head>

<body>
<div id="modeLabel" style="margin-bottom:10px;font-size:0.9rem;opacity:.7;">
WORK
</div>

<div class="clock-container">
    <div class="unit-row">
        <div class="label">MINS</div>
        <div class="dots-container" id="minutes"></div>
    </div>

    <div class="unit-row">
        <div class="label">SECS</div>
        <div class="dots-container" id="seconds"></div>
    </div>
</div>

<div id="digital-display">25:00</div>

<div class="controls">
    <button onclick="startTimer()">START</button>
    <button onclick="pauseTimer()">PAUSE</button>
    <button onclick="resetTimer()">RESET</button>
</div>

<div style="margin-top:10px; text-align:center;">
<a href="../" style="color:#00ff41; text-decoration:none; font-size:0.6rem;">
← return
</a>
</div>

<script>
let workSeconds = 25 * 60;
let breakSeconds = 5 * 60;
let totalSeconds = workSeconds;

let isWorkMode = true;
let timer = null;
let audioCtx = null;

// ドット生成
function setupDots(id, count) {
    const container = document.getElementById(id);
    for (let i = 0; i < count; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        container.appendChild(dot);
    }
}

setupDots('minutes', 6);
setupDots('seconds', 6);

function renderBinary(id, value) {
    const dots = document.getElementById(id).getElementsByClassName('dot');
    const binaryStr = value.toString(2).split('').reverse().join('');

    for (let i = 0; i < dots.length; i++) {
        if (binaryStr[i] === '1') {
            dots[i].classList.add('on');
        } else {
            dots[i].classList.remove('on');
        }
    }
}

function updateDisplay() {
    const mins = Math.floor(totalSeconds / 60);
    const secs = totalSeconds % 60;

    renderBinary('minutes', mins);
    renderBinary('seconds', secs);

    const timeStr =
        `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;

    document.getElementById('digital-display').innerText = timeStr;
    document.title = `${timeStr} - Pomodoro`;
}

// iPhone対応アラーム
function playAlarm(){
    if(!audioCtx) return;

    for(let i=0;i<3;i++){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.value = 880;
        osc.type = "sine";

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

        osc.start(audioCtx.currentTime + i*0.4);
        osc.stop(audioCtx.currentTime + i*0.4 + 0.3);
    }

    if(navigator.vibrate){
        navigator.vibrate([200,100,200]);
    }
}

function startTimer() {

    // ★ ユーザー操作時に音有効化
    if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume();
    }

    if (timer) return;

    timer = setInterval(() => {
        if (totalSeconds > 0) {
            totalSeconds--;
            updateDisplay();
        } else {

            playAlarm();

            // モード切替
            isWorkMode = !isWorkMode;

            if(isWorkMode){
                totalSeconds = workSeconds;
                document.getElementById("modeLabel").textContent = "WORK";
                document.body.style.color = "#00ff41";
            }else{
                totalSeconds = breakSeconds;
                document.getElementById("modeLabel").textContent = "BREAK";
                document.body.style.color = "#3ba4ff";
            }

            updateDisplay();
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(timer);
    timer = null;
}

function resetTimer() {
    pauseTimer();
    isWorkMode = true;
    totalSeconds = workSeconds;
    document.getElementById("modeLabel").textContent = "WORK";
    updateDisplay();
}

updateDisplay();
</script>

</body>
</html>
