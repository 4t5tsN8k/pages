<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リアルタイム為替ツール</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    padding: 15px;
    background: #f5f5f5;
    margin: 0;
}

.container {
    background: white;
    padding: clamp(15px, 4vw, 25px);
    border-radius: 12px;
    max-width: 480px;
    margin: auto;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
    font-size: clamp(1.2rem, 5vw, 1.4rem);
    text-align: center;
}

input, select, button {
    padding: 14px;
    margin-top: 10px;
    width: 100%;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ddd;
}

/* ボタン強調 */
button {
    background: #4a90e2;
    color: white;
    border: none;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

.result {
    margin-top: 18px;
    font-weight: bold;
    line-height: 2;
    font-size: clamp(0.95rem, 3.8vw, 1.05rem);
}

.rate {
    font-size: 0.8rem;
    color: gray;
    margin-top: 8px;
    text-align: center;
}

.return-link {
    margin-top: 15px;
    text-align: center;
}

.return-link a {
    color: #00aa66;
    text-decoration: none;
    font-size: 0.9rem;
}

/* 小型スマホ対応 */
@media (max-width: 380px) {
    input, select, button {
        padding: 12px;
    }

    .result {
        line-height: 1.8;
    }
}
</style>
</head>

<body>
<div class="container">
<h2>リアルタイム為替変換 💱</h2>

<select id="mode">
    <option value="JPY_TO">円 → 外貨</option>
    <option value="TO_JPY">外貨 → 円</option>
</select>

<input type="number" id="amount" placeholder="金額を入力">

<button onclick="convert()">変換</button>
<button onclick="fetchRates()">レート更新</button>

<div class="result" id="result"></div>
<div class="rate" id="rateInfo"></div>


<div class="return-link">
<a href="../">&lt;- return</a>
</div>
</div>

<script>
let rates = {};
let lastUpdated = null;

const currencies = [
    {code:"USD", name:"ドル", emoji:"💵"},
    {code:"EUR", name:"ユーロ", emoji:"💶"},
    {code:"GBP", name:"ポンド", emoji:"💷"},
    {code:"CNY", name:"中国元", emoji:"🇨🇳"},
    {code:"TWD", name:"台湾元", emoji:"🇹🇼"},
    {code:"KRW", name:"韓国ウォン", emoji:"🇰🇷"},
    {code:"VND", name:"ベトナムドン", emoji:"🇻🇳"},
    {code:"THB", name:"タイバーツ", emoji:"🇹🇭"}
];

async function fetchRates() {
    try {
        const response = await fetch("https://open.er-api.com/v6/latest/JPY");
        const data = await response.json();

        rates = data.rates;
        lastUpdated = new Date();

        document.getElementById("rateInfo").innerHTML =
            "最終更新: " + lastUpdated.toLocaleTimeString() + " (自動更新60秒)";

    } catch (e) {
        console.error(e);
    }
}

function convert() {
    const amount = parseFloat(document.getElementById("amount").value);
    const mode = document.getElementById("mode").value;
    const resultDiv = document.getElementById("result");

    if (!amount) {
        resultDiv.innerHTML = "金額を入力してください";
        return;
    }

    let html = "";

    currencies.forEach(c => {
        if (!rates[c.code]) return;

        let result;

        if (mode === "JPY_TO") {
            result = (amount * rates[c.code]).toLocaleString(undefined, {maximumFractionDigits:2});
            html += `${c.emoji} ${c.name}: ${result} ${c.code}<br>`;
        } else {
            result = (amount / rates[c.code]).toLocaleString(undefined, {maximumFractionDigits:2});
            html += `${c.emoji} ${c.name}: ${result} 円<br>`;
        }
    });

    resultDiv.innerHTML = html;
}

fetchRates();
setInterval(fetchRates, 60000);
</script>

</body>
</html>
